# Nginx: serves the CyberSOC frontend and proxies /api to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Static pages: /dashboard -> /dashboard.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # API -> FastAPI backend (compose service name)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Never cache the app shell aggressively; static assets can cache briefly
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
